{% extends 'base.html' %}
{% block title %}400 Bad Request — OpenSourceLens{% endblock %}
{% block content %}
<div class="container-xl py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-muted mb-3 font-monospace">400</div>
        <h1 class="h3 fw-bold text-dark mb-2">Invalid Repository Request</h1>
        <p class="text-secondary max-w-lg mx-auto mb-4">
            The repository format requested is malformed. Please provide a valid <code>owner/repository</code> identifier.
        </p>
        <a href="{% url 'home' %}" class="btn os-btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Search
        </a>
    </div>
</div>
{% endblock %}
